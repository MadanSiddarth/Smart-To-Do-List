<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo-container">
        <h1>My Tasks</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>
        <form id="task-form">
            <input 
            type="text"
            id="task-input"
            placeholder="What do you need to do?"
            autocomplete="off"
            required
        >

        <input 
        type="date"
        id="task-due-date"
        aria-label="Task due date"
        >
        <select id="task-priority" aria-label="Task priority">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="high">High priority</option>
        </select>
        
        <button type="submit" id="add-btn">Add Task</button>
        </form>

        <div class="filters">
            <button type="button" class="filter active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="active">Active</button>
            <button type="button" class="filter" data-filter="completed">Completed</button>
        </div>

        <p id="task-count">0 tasks remaining</p>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task!</p>
    </main>
</body>
</html>
